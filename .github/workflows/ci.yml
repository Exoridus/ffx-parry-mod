name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: ${{ matrix.configuration == 'Debug' && 'Verify' || 'Release' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          full-build: ${{ matrix.configuration == 'Release' }}
      - name: Validate Parry commit subjects
        if: github.event_name == 'pull_request' && matrix.configuration == 'Debug' && hashFiles('build/Build.csproj') != ''
        shell: cmd
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: build.cmd commit-check --range "%COMMIT_BASE%..%COMMIT_HEAD%"
      - name: Verify Debug payload and tests
        if: matrix.configuration == 'Debug'
        shell: cmd
        run: build.cmd mod-verify --sdk local --configuration Debug
      - name: Build and verify mod + full development packages
        if: matrix.configuration == 'Release'
        shell: cmd
        run: build.cmd mod-pack --sdk local --configuration Release --tag v0.0.0-ci --out-dir .release --full true
      - name: Upload installable development packages
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-packages-${{ github.sha }}
          path: |
            .release/*.zip
            .release/*.sha256
            .release/*.provenance.json
            .release/release-notes.md
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
