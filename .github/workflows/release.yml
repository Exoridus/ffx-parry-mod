name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag matching the project, e.g. v0.1.0'
        type: string
        required: true
      sdk:
        description: 'Official is required for public releases; local is development dry-run only.'
        type: choice
        options: [official, local]
        default: official
      dry_run:
        description: 'Build and upload artifacts without creating a release or tag.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release request
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SDK: ${{ inputs.sdk }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected vX.Y.Z.' }
          $projects = @(Get-ChildItem -Filter 'Fahrenheit.Mods.*.csproj')
          if ($projects.Count -ne 1) { throw 'Expected one mod project.' }
          [xml]$metadata = Get-Content $projects[0].FullName -Raw
          $version = @($metadata.Project.PropertyGroup.Version | Where-Object { $_ })
          if ($version.Count -ne 1 -or "v$($version[0])" -ne $env:RELEASE_VERSION) { throw 'Tag must match project Version.' }
          if ($env:RELEASE_DRY_RUN -ne 'true' -and $env:RELEASE_SDK -ne 'official') { throw 'Public distribution requires the official SDK.' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_VERSION"
          if ($LASTEXITCODE -eq 0) { throw 'Tag already exists; release tags are immutable.' }
          if ($LASTEXITCODE -ne 1) { throw 'Failed to check the release tag.' }
          $global:LASTEXITCODE = 0
      - uses: ./.github/actions/setup-build
        with:
          full-build: ${{ inputs.sdk == 'local' }}
      - name: Verify Debug payload and tests
        shell: cmd
        run: build.cmd mod-verify --sdk local --configuration Debug
      - name: Build verified Release packages
        shell: cmd
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SDK: ${{ inputs.sdk }}
        run: build.cmd mod-pack --sdk "%RELEASE_SDK%" --configuration Release --tag "%RELEASE_VERSION%" --out-dir .release --full true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            .release/*.zip
            .release/*.sha256
            .release/*.provenance.json
            .release/release-notes.md
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
  publish:
    if: ${{ !inputs.dry_run && inputs.sdk == 'official' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-packages
          path: .release
      - name: Publish experimental release after successful verification
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: .release/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .release/*.zip
            .release/*.sha256
            .release/*.provenance.json
